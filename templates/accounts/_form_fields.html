{% for field in form %}
  <div class="form-group">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="form-help">{{ field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}<p class="form-error">{{ field.errors|striptags }}</p>{% endif %}
  </div>
{% endfor %}
{% if form.non_field_errors %}<p class="form-error">{{ form.non_field_errors|striptags }}</p>{% endif %}
