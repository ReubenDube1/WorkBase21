{% extends "base.html" %}
{% block content %}
<section class="page-header"><div class="container">
  <h1>Forgot Your Password?</h1>
  <p>Enter the email address you signed up with and we'll email you a link to set a new password.</p>
</div></section>
<section class="section"><div class="container narrow-content">
  <form method="post" class="contact-form fade-in">
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <button type="submit" class="btn btn-primary btn-lg">Send Reset Link</button>
  </form>
  <p class="auth-switch">Remembered it? <a href="{% url 'login' %}">Log in</a></p>
</div></section>
{% endblock %}
