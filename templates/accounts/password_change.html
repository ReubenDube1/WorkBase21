{% extends "base.html" %}
{% block content %}
<section class="page-header"><div class="container"><h1>Change Password</h1></div></section>
<section class="section"><div class="container narrow-content">
  <form method="post" class="contact-form fade-in">
    {% csrf_token %}
    {% include "partials/_form_fields.html" %}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary btn-lg">Change Password</button>
      <a href="{% url 'account_settings' %}" class="btn btn-outline btn-lg">Cancel</a>
    </div>
  </form>
</div></section>
{% endblock %}
