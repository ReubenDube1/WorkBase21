{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a href="?{% if extra_qs %}{{ extra_qs }}&{% elif query %}q={{ query }}&{% endif %}page={{ page_obj.previous_page_number }}" class="page-link">&larr; Prev</a>
  {% endif %}

  <span class="page-current">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>

  {% if page_obj.has_next %}
    <a href="?{% if extra_qs %}{{ extra_qs }}&{% elif query %}q={{ query }}&{% endif %}page={{ page_obj.next_page_number }}" class="page-link">Next &rarr;</a>
  {% endif %}
</nav>
{% endif %}
